title: Cleio
description: 녹음하면 음성 기록과 AI 요약이 자동으로 만들어지는 iPhone·Mac 앱
theme: jekyll-theme-cayman

# 한국어 정본
lang: ko-KR

# App Store 제품 페이지 — 🔴 앱 ID 는 6760225470 이다.
# 종전 랜딩은 `/app/cleio` 를 링크해 **404** 였다(2026-09-11 실측).
app_store_url: "https://apps.apple.com/app/id6760225470"

# 사이트 URL
url: "https://cleioapp.github.io"
baseurl: ""

# 마크다운 파서
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true                # h2/h3에 자동 id 부여 (앵커 링크용)
  toc_levels: "2..3"

# 빌드 제외
exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .DS_Store

# 클린 URL (확장자 없는 경로)
permalink: /:title/
